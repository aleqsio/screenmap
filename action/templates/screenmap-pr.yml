# .github/workflows/screenmap-pr.yml — review what a PR changes on-screen
name: screenmap · PR changes
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: screenmap-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: write        # push bundles to the screenmaps branch (set publish: false to drop this)
  pull-requests: write   # sticky comment
  actions: write         # start the baseline workflow if no map exists yet
jobs:
  changes:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: aleqsio/screenmap@v1
        with:
          mode: pr
          agent_api_key: ${{ secrets.ANTHROPIC_API_KEY }}   # optional — omit for deterministic-only
          # agent_provider: claude   # or codex | gemini | opencode — pass the matching key above
          expo_token: ${{ secrets.EXPO_TOKEN }}   # EAS builds/serves the dev client (or pass app_path instead)
          # platform: ios     # or android (then use runs-on: ubuntu-latest — a tenth of the macOS rate)
          # project: apps/mobile
          # publish: "false"   # private repos that only want the artifact link

